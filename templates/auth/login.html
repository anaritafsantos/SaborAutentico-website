{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito — Sabor Autêntico</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/auth_login.css' %}">
</head>

<body>

<div class="container">

    <h2>Painel de Gestão</h2>
    <p class="subtitle">Acesso Exclusivo à Equipa</p>

    {% if form.errors %}
        <div class="alert">
            Credenciais inválidas.
        </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Email Institucional</label>
            <input type="email"
                   name="username"
                   value="{{ form.username.value|default_if_none:'' }}"
                   required
                   placeholder="exemplo@saborautentico.pt">
        </div>

        <div class="form-group">
            <label>Palavra-Passe</label>
            <input type="password"
                   name="password"
                   required
                   placeholder="Password123! :)">
        </div>

        <button type="submit" class="btn-submit">
            Entrar no Sistema
        </button>
    </form>

    <a href="{% url 'home' %}" class="back-link">
        ← Voltar ao Site Público
    </a>

</div>

</body>
</html>
