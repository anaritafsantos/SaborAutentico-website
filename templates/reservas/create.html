<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 py-12">
    <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
        <div class="bg-white p-6 rounded shadow">

            <h2 class="text-2xl font-bold mb-6">Nova Reserva</h2>

            <form method="POST" action="{% url 'reservas_store' %}">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-4">

                    <!-- Cliente -->
                    <select name="id_cliente" class="border p-2" required>
                        <option value="">Cliente...</option>
                        {% for cliente in clientes %}
                            <option value="{{ cliente.id_cliente }}">
                                {{ cliente.nome }}
                            </option>
                        {% endfor %}
                    </select>

                    <!-- Número de pessoas -->
                    <input type="number" name="numero_pessoas" min="1"
                           class="border p-2" placeholder="Nº Pessoas" required>

                    <!-- Data -->
                    <input type="date" name="data_reserva"
                           class="border p-2" required>

                    <!-- Hora -->
                    <input type="time" name="hora"
                           class="border p-2" required>

                </div>

                <!-- Mesas -->
                <div class="mt-4 border p-4">
                    <p class="font-bold mb-2">Mesas:</p>

                    {% for mesa in mesas %}
                        <label class="mr-4">
                            <input type="checkbox" name="id_mesa" value="{{ mesa.id_mesa }}">
                            Mesa {{ mesa.numero }}
                        </label>
                    {% endfor %}
                </div>

                <button type="submit"
                        class="mt-4 bg-green-600 text-white px-4 py-2 rounded">
                    Confirmar
                </button>

            </form>

        </div>
    </div>
</body>
</html>
